name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Tests
        run: python3 -m unittest -v
      - name: Worked example is clean
        run: python3 skills/metadoc/scripts/metadoc_tool.py check skills/metadoc/examples/token_bucket.metadoc
